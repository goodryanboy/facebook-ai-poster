name: Daily AI Image → Facebook Post

on:
  schedule:
    # 21:00 UTC = 05:00 PH | 03:00 UTC = 11:00 PH | 09:00 UTC = 17:00 PH
    # Shifted 1hr earlier than target posting time to offset GitHub's typical
    # scheduled-workflow delay, so actual posts land closer to 6am/12pm/6pm PH.
    - cron: "0 21,3,9 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  post-image:
    runs-on: ubuntu-latest
    # Multi-page runs generate one image per page; allow headroom.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Random delay (spread posting time within a 30-min window)
        run: sleep $((RANDOM % 100))

      - name: Generate images and post to Facebook page(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          # Multi-page credentials (keys must match prompts.json → pages)
          # FB_PAGE_IDS:    {"main":"123456789","other":"987654321"}
          # FB_PAGE_TOKENS: {"main":"EAAxxx","other":"EAAyyy"}
          FB_PAGE_IDS: ${{ secrets.FB_PAGE_IDS }}
          FB_PAGE_TOKENS: ${{ secrets.FB_PAGE_TOKENS }}
          # Legacy single-page fallback
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: npm start

      - name: Upload generated images as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: output/
          retention-days: 7

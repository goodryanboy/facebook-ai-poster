name: Daily AI Image → Facebook Post

on:
  schedule:
    # 22:00 UTC = 06:00 PH | 04:00 UTC = 12:00 PH | 10:00 UTC = 18:00 PH
    - cron: "0 22,4,10 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  post-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate image and post to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: npm start

      - name: Upload generated image as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: output/
          retention-days: 7